<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock Subagent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f4f6f9; color: #1a1a2e; min-height: 100vh; padding: 2rem; }
    h1 { font-size: 1.6rem; margin-bottom: 0.25rem; }
    .subtitle { color: #666; margin-bottom: 1.5rem; font-size: 0.9rem; }
    .input-area { background: #fff; border-radius: 10px; padding: 1.25rem; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 1.5rem; max-width: 640px; }
    textarea { width: 100%; border: 1px solid #ddd; border-radius: 6px; padding: 0.6rem 0.75rem; font-size: 0.95rem; resize: vertical; min-height: 80px; outline: none; }
    textarea:focus { border-color: #4f46e5; }
    button { margin-top: 0.75rem; background: #4f46e5; color: #fff; border: none; border-radius: 6px; padding: 0.55rem 1.2rem; font-size: 0.95rem; cursor: pointer; }
    button:disabled { background: #a5b4fc; cursor: not-allowed; }
    .hint { font-size: 0.8rem; color: #888; margin-top: 0.4rem; }
    .results { display: grid; gap: 1rem; max-width: 640px; }
    .card { background: #fff; border-radius: 10px; padding: 1.1rem 1.25rem; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.6rem; }
    .card-header h2 { font-size: 1.05rem; }
    .sector { font-size: 0.78rem; color: #666; margin-top: 2px; }
    .badge { border-radius: 5px; padding: 0.25rem 0.6rem; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.03em; white-space: nowrap; }
    .badge-BUY  { background: #dcfce7; color: #166534; }
    .badge-HOLD { background: #fef9c3; color: #854d0e; }
    .badge-AVOID{ background: #fee2e2; color: #991b1b; }
    .summary { font-size: 0.88rem; line-height: 1.5; margin-bottom: 0.6rem; color: #333; }
    .cases { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
    .case { border-radius: 6px; padding: 0.5rem 0.65rem; font-size: 0.8rem; line-height: 1.4; }
    .bull { background: #f0fdf4; border-left: 3px solid #4ade80; }
    .bear { background: #fff1f2; border-left: 3px solid #f87171; }
    .case-label { font-weight: 600; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2px; }
    .bull .case-label { color: #166534; }
    .bear .case-label { color: #991b1b; }
    .loading-card { background: #fff; border-radius: 10px; padding: 1.1rem 1.25rem; box-shadow: 0 1px 4px rgba(0,0,0,0.08); color: #888; font-size: 0.9rem; display: flex; align-items: center; gap: 0.5rem; }
    .spinner { width: 16px; height: 16px; border: 2px solid #e0e0e0; border-top-color: #4f46e5; border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-card { background: #fff; border-radius: 10px; padding: 1rem 1.25rem; box-shadow: 0 1px 4px rgba(0,0,0,0.08); border-left: 4px solid #f87171; font-size: 0.88rem; color: #991b1b; }
  </style>
</head>
<body>
  <h1>Stock Subagent</h1>
  <p class="subtitle">Equity research powered by Claude</p>

  <div class="input-area">
    <textarea id="companies" placeholder="Apple&#10;Tesla&#10;Microsoft"></textarea>
    <p class="hint">One company name per line</p>
    <button id="analyzeBtn" onclick="analyze()">Analyze</button>
  </div>

  <div class="results" id="results"></div>

  <script>
    async function analyze() {
      const textarea = document.getElementById("companies");
      const btn = document.getElementById("analyzeBtn");
      const resultsEl = document.getElementById("results");

      const companies = textarea.value.split("\n").map(s => s.trim()).filter(Boolean);
      if (!companies.length) return;

      btn.disabled = true;
      resultsEl.innerHTML = "";

      // Show loading cards for all companies upfront
      const loadingCards = {};
      for (const name of companies) {
        const el = document.createElement("div");
        el.className = "loading-card";
        el.innerHTML = `<div class="spinner"></div> Analyzing <strong>${escHtml(name)}</strong>…`;
        resultsEl.appendChild(el);
        loadingCards[name] = el;
      }

      try {
        const resp = await fetch("/analyze", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ companies }),
        });

        if (!resp.ok) {
          throw new Error(`Server error: ${resp.status}`);
        }

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });

          const lines = buf.split("\n");
          buf = lines.pop(); // keep incomplete line

          for (const line of lines) {
            if (!line.startsWith("data: ")) continue;
            const payload = JSON.parse(line.slice(6));
            if (payload.status === "done") break;
            if (payload.status === "ok") replaceCard(loadingCards, payload.result, null);
            if (payload.status === "error") replaceCard(loadingCards, null, payload);
          }
        }
      } catch (err) {
        resultsEl.insertAdjacentHTML("beforeend",
          `<div class="error-card">Request failed: ${escHtml(err.message)}</div>`);
      } finally {
        // Replace any still-loading cards (e.g. companies not returned)
        for (const el of Object.values(loadingCards)) {
          if (el.parentNode) el.remove();
        }
        btn.disabled = false;
      }
    }

    function replaceCard(loadingCards, result, errorPayload) {
      const name = result ? result.company : errorPayload.company;
      const target = loadingCards[name] || findLoadingCard(name);
      const card = errorPayload ? renderError(errorPayload) : renderCard(result);
      if (target && target.parentNode) {
        target.parentNode.replaceChild(card, target);
        delete loadingCards[name];
      } else {
        document.getElementById("results").appendChild(card);
      }
    }

    function findLoadingCard(name) {
      for (const el of document.querySelectorAll(".loading-card")) {
        if (el.textContent.includes(name)) return el;
      }
    }

    function renderCard(r) {
      const verdict = r.verdict || "HOLD";
      const div = document.createElement("div");
      div.className = "card";
      div.innerHTML = `
        <div class="card-header">
          <div>
            <h2>${escHtml(r.company)}</h2>
            <div class="sector">${escHtml(r.sector || "")}</div>
          </div>
          <span class="badge badge-${escHtml(verdict)}">${escHtml(verdict)}</span>
        </div>
        <p class="summary">${escHtml(r.summary || "")}</p>
        <div class="cases">
          <div class="case bull"><div class="case-label">Bull case</div>${escHtml(r.bull_case || "")}</div>
          <div class="case bear"><div class="case-label">Bear case</div>${escHtml(r.bear_case || "")}</div>
        </div>`;
      return div;
    }

    function renderError(e) {
      const div = document.createElement("div");
      div.className = "error-card";
      div.textContent = `${e.company}: ${e.message}`;
      return div;
    }

    function escHtml(s) {
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LookThru Trace</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #21262d;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --critical: #f85149;
      --warning: #d29922;
      --info: #3fb950;
      --critical-bg: rgba(248,81,73,0.1);
      --warning-bg: rgba(210,153,34,0.1);
      --info-bg: rgba(63,185,80,0.1);
    }

    body {
      font-family: "SF Mono", "Fira Code", ui-monospace, monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1.5rem;
    }

    header { margin-bottom: 2rem; max-width: 900px; }
    header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
    header h1 span { color: var(--accent); }
    header p { color: var(--muted); font-size: 0.82rem; margin-top: 0.3rem; font-family: system-ui, sans-serif; }

    .workspace {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 1.5rem;
      max-width: 1100px;
      align-items: start;
    }

    @media (max-width: 720px) {
      .workspace { grid-template-columns: 1fr; }
    }

    /* ---- Left panel ---- */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
    }

    .panel-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    .trace-entries { display: flex; flex-direction: column; gap: 0.6rem; }

    .trace-entry {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.6rem 0.7rem;
      position: relative;
    }

    .trace-entry input[type="text"] {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--accent);
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
    }

    .trace-entry input[type="text"]::placeholder { color: var(--muted); font-weight: 400; }

    .trace-entry textarea {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: inherit;
      font-size: 0.72rem;
      line-height: 1.5;
      resize: vertical;
      min-height: 90px;
    }

    .trace-entry textarea::placeholder { color: var(--muted); }

    .remove-btn {
      position: absolute;
      top: 0.4rem;
      right: 0.5rem;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.85rem;
      line-height: 1;
      padding: 0;
    }
    .remove-btn:hover { color: var(--critical); }

    .add-btn {
      background: none;
      border: 1px dashed var(--border);
      border-radius: 6px;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.78rem;
      padding: 0.45rem;
      cursor: pointer;
      width: 100%;
      margin-top: 0.5rem;
      transition: border-color 0.15s, color 0.15s;
    }
    .add-btn:hover { border-color: var(--accent); color: var(--accent); }

    .analyze-btn {
      margin-top: 1rem;
      width: 100%;
      background: var(--accent);
      color: #0d1117;
      border: none;
      border-radius: 6px;
      padding: 0.6rem;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: opacity 0.15s;
    }
    .analyze-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ---- Right panel (results) ---- */
    .results { display: flex; flex-direction: column; gap: 0.9rem; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.1rem;
      animation: fadein 0.2s ease;
    }
    @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.6rem;
      gap: 0.5rem;
    }

    .card-label { font-size: 0.9rem; font-weight: 700; color: var(--text); }
    .card-latency { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }

    .badge {
      border-radius: 4px;
      padding: 0.2rem 0.55rem;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }
    .badge-CRITICAL { background: var(--critical-bg); color: var(--critical); border: 1px solid var(--critical); }
    .badge-WARNING  { background: var(--warning-bg);  color: var(--warning);  border: 1px solid var(--warning);  }
    .badge-INFO     { background: var(--info-bg);     color: var(--info);     border: 1px solid var(--info);     }

    .section-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 0.2rem;
      margin-top: 0.65rem;
    }

    .root-cause { font-size: 0.82rem; color: var(--text); line-height: 1.5; font-family: system-ui, sans-serif; }

    .hotspot {
      background: var(--surface2);
      border-left: 3px solid var(--warning);
      border-radius: 0 4px 4px 0;
      padding: 0.35rem 0.6rem;
      font-size: 0.73rem;
      color: var(--warning);
      word-break: break-all;
    }

    .recommendation {
      background: var(--surface2);
      border-left: 3px solid var(--info);
      border-radius: 0 4px 4px 0;
      padding: 0.35rem 0.6rem;
      font-size: 0.78rem;
      color: var(--text);
      font-family: system-ui, sans-serif;
      line-height: 1.5;
    }

    .services {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-top: 0.25rem;
    }
    .svc-tag {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.15rem 0.5rem;
      font-size: 0.7rem;
      color: var(--accent);
    }

    /* Loading card */
    .loading-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.1rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      color: var(--muted);
      font-size: 0.82rem;
    }
    .spinner {
      width: 14px; height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-card {
      background: var(--surface);
      border: 1px solid var(--critical);
      border-radius: 8px;
      padding: 0.9rem 1.1rem;
      font-size: 0.82rem;
      color: var(--critical);
    }

    .empty-state {
      color: var(--muted);
      font-size: 0.82rem;
      text-align: center;
      padding: 2rem 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>LookThru <span>Trace</span></h1>
    <p>Paste stack traces, distributed trace logs, or error snippets — Claude diagnoses each one instantly.</p>
  </header>

  <div class="workspace">
    <!-- Left: Input panel -->
    <div class="panel">
      <div class="panel-title">Trace Inputs</div>
      <div class="trace-entries" id="traceEntries"></div>
      <button class="add-btn" onclick="addEntry()">+ Add trace</button>
      <button class="analyze-btn" id="analyzeBtn" onclick="analyze()">Analyze Traces</button>
    </div>

    <!-- Right: Results -->
    <div class="results" id="results">
      <div class="empty-state" id="emptyState">Results will appear here as each trace is analyzed.</div>
    </div>
  </div>

  <script>
    const EXAMPLES = [
      {
        label: "auth-service",
        text: `Exception in thread "main" java.lang.NullPointerException
  at com.example.auth.TokenValidator.validate(TokenValidator.java:42)
  at com.example.auth.AuthFilter.doFilter(AuthFilter.java:88)
  at org.springframework.web.filter.OncePerRequestFilter.doFilter(OncePerRequestFilter.java:119)
Caused by: com.example.auth.JwtExpiredException: JWT token expired at 2024-05-18T10:23:11Z`,
      },
      {
        label: "checkout-span",
        text: `TraceID: 4bf92f3577b34da6a3ce929d0e0e4736
Span: checkout.processPayment  duration=4821ms  status=ERROR
  -> payment-gateway.charge     duration=4780ms  status=TIMEOUT
     host: payment-gw-prod-3
     http.status_code: 504
     db.query: SELECT * FROM orders WHERE id=? (unindexed scan, 2.1M rows)`,
      },
    ];

    let entryCount = 0;

    function addEntry(label = "", text = "") {
      const id = ++entryCount;
      const container = document.getElementById("traceEntries");
      const el = document.createElement("div");
      el.className = "trace-entry";
      el.dataset.id = id;
      el.innerHTML = `
        <button class="remove-btn" onclick="removeEntry(${id})" title="Remove">✕</button>
        <input type="text" placeholder="Label (e.g. auth-service)" value="${escAttr(label)}" />
        <textarea placeholder="Paste stack trace, span JSON, or log snippet…">${escHtml(text)}</textarea>`;
      container.appendChild(el);
    }

    function removeEntry(id) {
      const el = document.querySelector(`.trace-entry[data-id="${id}"]`);
      if (el) el.remove();
    }

    function getEntries() {
      return Array.from(document.querySelectorAll(".trace-entry")).map((el) => ({
        label: el.querySelector("input").value.trim() || `Trace ${el.dataset.id}`,
        text: el.querySelector("textarea").value.trim(),
      })).filter((e) => e.text);
    }

    async function analyze() {
      const entries = getEntries();
      if (!entries.length) return;

      const btn = document.getElementById("analyzeBtn");
      const resultsEl = document.getElementById("results");
      const emptyState = document.getElementById("emptyState");

      btn.disabled = true;
      if (emptyState) emptyState.remove();
      resultsEl.innerHTML = "";

      const loadingCards = {};
      for (const { label } of entries) {
        const el = document.createElement("div");
        el.className = "loading-card";
        el.innerHTML = `<div class="spinner"></div> Analyzing <strong>${escHtml(label)}</strong>…`;
        resultsEl.appendChild(el);
        loadingCards[label] = el;
      }

      try {
        const resp = await fetch("/analyze", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ traces: entries }),
        });

        if (!resp.ok) throw new Error(`Server error: ${resp.status}`);

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const lines = buf.split("\n");
          buf = lines.pop();

          for (const line of lines) {
            if (!line.startsWith("data: ")) continue;
            const payload = JSON.parse(line.slice(6));
            if (payload.status === "done") break;
            if (payload.status === "ok") swapCard(loadingCards, payload.result, null);
            if (payload.status === "error") swapCard(loadingCards, null, payload);
          }
        }
      } catch (err) {
        resultsEl.insertAdjacentHTML("beforeend",
          `<div class="error-card">Request failed: ${escHtml(err.message)}</div>`);
      } finally {
        for (const el of Object.values(loadingCards)) {
          if (el.parentNode) el.remove();
        }
        btn.disabled = false;
      }
    }

    function swapCard(loadingCards, result, errPayload) {
      const label = result ? result.label : errPayload.label;
      const target = loadingCards[label] || findLoading(label);
      const card = errPayload ? renderError(errPayload) : renderCard(result);
      if (target && target.parentNode) {
        target.parentNode.replaceChild(card, target);
        delete loadingCards[label];
      } else {
        document.getElementById("results").appendChild(card);
      }
    }

    function findLoading(label) {
      for (const el of document.querySelectorAll(".loading-card")) {
        if (el.textContent.includes(label)) return el;
      }
    }

    function renderCard(r) {
      const sev = r.severity || "INFO";
      const svcs = Array.isArray(r.services) ? r.services : [];
      const div = document.createElement("div");
      div.className = "card";
      div.innerHTML = `
        <div class="card-top">
          <div>
            <div class="card-label">${escHtml(r.label)}</div>
            ${r.latency_ms != null ? `<div class="card-latency">${escHtml(String(r.latency_ms))} ms</div>` : ""}
          </div>
          <span class="badge badge-${escHtml(sev)}">${escHtml(sev)}</span>
        </div>

        <div class="section-label">Root Cause</div>
        <div class="root-cause">${escHtml(r.root_cause || "")}</div>

        ${r.hotspot ? `
        <div class="section-label">Hotspot</div>
        <div class="hotspot">${escHtml(r.hotspot)}</div>` : ""}

        <div class="section-label">Recommendation</div>
        <div class="recommendation">${escHtml(r.recommendation || "")}</div>

        ${svcs.length ? `
        <div class="section-label">Services / Components</div>
        <div class="services">${svcs.map((s) => `<span class="svc-tag">${escHtml(s)}</span>`).join("")}</div>` : ""}
      `;
      return div;
    }

    function renderError(e) {
      const div = document.createElement("div");
      div.className = "error-card";
      div.textContent = `${e.label}: ${e.message}`;
      return div;
    }

    function escHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function escAttr(s) {
      return String(s).replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    // Seed with two example entries
    for (const ex of EXAMPLES) addEntry(ex.label, ex.text);
  </script>
</body>
</html>

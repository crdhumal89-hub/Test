name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apollocam/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r apollocam/requirements.txt
          pip install pytest

      - name: Run tests
        working-directory: apollocam
        run: python -m pytest -q
